<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMD Workspace</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--subtle:#f9fafb;--line:#e5e7eb;--line2:#d1d5db;
  --tx:#111827;--tx2:#4b5563;--mut:#9ca3af;--dark:#1f2937;--mid:#4b5563;
  --r:12px;--sh:0 1px 2px rgba(17,24,39,.05),0 1px 3px rgba(17,24,39,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Topbar */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--dark);color:#fff;display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.brand b{display:block;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.brand span{font-size:12px;color:var(--mut)}
.sp{flex:1}
.saved{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.saved i{width:7px;height:7px;border-radius:50%;background:#9ca3af;display:inline-block}

/* Layout */
main{max-width:1240px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:24px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr;padding:16px}.top{padding:12px 16px}}
.col{display:grid;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--subtle)}
.ch h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tx2)}
.ch .sp{flex:1}
.cb{padding:18px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);color:var(--tx2);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.btn:hover{background:var(--subtle);border-color:var(--mut);color:var(--tx)}
.btn.pri{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.pri:hover{background:#111827}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--mid);outline-offset:2px}

/* Editor */
textarea{width:100%;min-height:230px;border:0;padding:16px 18px;resize:vertical;background:var(--surface);font:13px/1.65 "SF Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--tx)}
textarea:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--line2)}
#preview{padding:26px 32px;overflow-x:auto;min-height:160px}
#preview h1{font-size:1.7rem;letter-spacing:-.02em;margin:.2em 0 .3em}
#preview h2{font-size:1.3rem;margin:1.4em 0 .4em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
#preview h3{font-size:1.1rem;margin:1.2em 0 .3em}
#preview p,#preview li{color:#1f2937}
#preview a{color:var(--dark)}
#preview blockquote{margin:1em 0;padding:.2em 1em;border-left:3px solid var(--line2);color:var(--tx2)}
#preview code{background:#eef0f3;padding:2px 6px;border-radius:5px;font-size:.88em}
#preview pre{background:var(--dark);color:#e5e7eb;padding:14px 16px;border-radius:10px;overflow-x:auto;position:relative}
#preview pre code{background:none;padding:0;color:inherit}
#preview pre[data-lang]{padding-top:30px}
#preview pre[data-lang]::before{content:attr(data-lang);position:absolute;top:8px;left:16px;font:600 10px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:#9ca3af}
#preview table{border-collapse:collapse;width:100%;font-size:14px}
#preview th{background:var(--subtle);text-align:left}
#preview td,#preview th{border:1px solid var(--line);padding:7px 11px}
.lead{color:var(--mut);margin:0 0 1.2em;font-size:.92rem}
.hint{color:var(--mut);text-align:center;padding:30px 0}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--subtle);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.big{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.big b{font-size:38px;letter-spacing:-.03em;line-height:1}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:#e5e7eb;color:var(--tx2)}
.chip.done{background:var(--dark);color:#fff}
.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#6b7280,#374151);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.fill.done{background:var(--dark)}

/* Tasks */
.add{display:flex;gap:8px;margin:20px 0 14px}
.add input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:8px;padding:9px 12px;background:var(--surface)}
.tabs{display:flex;gap:4px;background:#eceef1;padding:3px;border-radius:9px;margin-bottom:6px}
.tab{flex:1;border:0;background:none;padding:6px;border-radius:7px;font-size:13px;font-weight:500;color:var(--tx2);cursor:pointer}
.tab.on{background:var(--surface);color:var(--tx);box-shadow:var(--sh)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input{appearance:none;width:20px;height:20px;border:1.5px solid var(--line2);border-radius:6px;background:var(--surface);cursor:pointer;flex:none;display:grid;place-items:center;transition:.15s}
li input:checked{background:var(--dark);border-color:var(--dark)}
li input:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
li span{flex:1;word-break:break-word}
li.on span{color:var(--mut);text-decoration:line-through}
li .num{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;width:22px}
li .del{border:0;background:none;color:var(--mut);cursor:pointer;padding:5px;border-radius:6px;opacity:.6}
li .del:hover{background:#eceef1;color:var(--tx);opacity:1}
.empty{text-align:center;color:var(--mut);padding:26px 0;font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;color:var(--mut)}
.link{background:none;border:0;color:var(--tx2);text-decoration:underline;cursor:pointer;font-size:12.5px}
.sticky{position:sticky;top:78px}
@media(max-width:900px){.sticky{position:static}}
</style>
</head>
<body>
<header><div class="top">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
  <div class="brand"><b>RMD Workspace</b><span>Documento e acompanhamento de etapas</span></div>
  <div class="sp"></div>
  <div class="saved"><i></i><span id="saved">Salvo no navegador</span></div>
</div></header>

<main>
  <div class="col">
    <div class="card">
      <div class="ch"><h2>Editor RMD</h2><div class="sp"></div>
        <button class="btn" id="imp" title="Cria etapas a partir de linhas - [ ] tarefa"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Importar checkboxes</button>
        <button class="btn" id="clr">Limpar</button>
      </div>
      <textarea id="rmd" spellcheck="false" placeholder="Cole aqui o conteúdo do seu arquivo .Rmd…"></textarea>
    </div>
    <div class="card">
      <div class="ch"><h2>Visualização</h2></div>
      <div id="preview"></div>
    </div>
  </div>

  <div class="card sticky">
    <div class="ch"><h2>Progresso</h2></div>
    <div class="cb">
      <div class="big"><b id="pct">0%</b><span class="chip" id="chip">Não iniciado</span></div>
      <div class="bar"><div id="fill" class="fill"></div></div>
      <div class="stats" style="margin:18px 0 0">
        <div class="stat"><b id="sTot">0</b><span>Total</span></div>
        <div class="stat"><b id="sDone">0</b><span>Feitas</span></div>
        <div class="stat"><b id="sLeft">0</b><span>Restam</span></div>
      </div>
      <div class="add">
        <input type="text" id="new" placeholder="Adicionar nova etapa…" maxlength="200">
        <button class="btn pri" id="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Adicionar</button>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab on" data-f="all">Todas</button>
        <button class="tab" data-f="todo">Pendentes</button>
        <button class="tab" data-f="done">Concluídas</button>
      </div>
      <ul id="list"></ul>
      <div class="foot"><span id="weight"></span><button class="link" id="clrDone">Remover concluídas</button></div>
    </div>
  </div>
</main>

<script>
let tasks=[],filter='all';
const $=id=>document.getElementById(id);

function load(){
  try{
    $('rmd').value=localStorage.getItem('rmd')||'';
    tasks=JSON.parse(localStorage.getItem('tasks')||'[]');
  }catch(e){tasks=[]}
}
function save(){
  try{
    localStorage.setItem('rmd',$('rmd').value);
    localStorage.setItem('tasks',JSON.stringify(tasks));
    $('saved').textContent='Salvo às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){$('saved').textContent='Não foi possível salvar'}
}

/* ---------- RMD → HTML ---------- */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function renderRmd(){
  let src=$('rmd').value,head='';
  if(!src.trim()){$('preview').innerHTML='<div class="hint">A visualização do documento aparece aqui.</div>';return}
  const m=src.match(/^---\s*\n([\s\S]*?)\n---\s*(\n|$)/);
  if(m){
    src=src.slice(m[0].length);
    const get=k=>{const r=m[1].match(new RegExp('^'+k+':\\s*["\']?(.*?)["\']?\\s*$','m'));return r?r[1]:''};
    const t=get('title'),sub=[get('author'),get('date')].filter(Boolean).join(' · ');
    if(t)head+='<h1>'+esc(t)+'</h1>';
    if(sub)head+='<p class="lead">'+esc(sub)+'</p>';
  }
  src=src.replace(/^```\{(\w+)[^}]*\}\s*\n([\s\S]*?)^```/gm,(_,l,c)=>'\n<pre data-lang="'+l+'"><code>'+esc(c.replace(/\n$/,''))+'</code></pre>\n');
  src=src.replace(/`r\s+([^`]+)`/g,'<code>r: $1</code>');
  let html=marked.parse(src,{gfm:true});
  if(window.DOMPurify)html=DOMPurify.sanitize(html,{ADD_ATTR:['data-lang']});
  $('preview').innerHTML=head+html;
}

/* ---------- Progresso ---------- */
function render(){
  const total=tasks.length,done=tasks.filter(t=>t.done).length;
  // inteiro, sem dízima: 33,33…→33% · 66,66…→67%
  const p=total?Math.round(done/total*100):0;
  $('fill').style.width=p+'%';
  $('fill').classList.toggle('done',p===100);
  $('pct').textContent=p+'%';
  const chip=$('chip');
  chip.textContent=!total?'Sem etapas':p===100?'Concluído':done?'Em andamento':'Não iniciado';
  chip.classList.toggle('done',p===100);
  $('sTot').textContent=total;$('sDone').textContent=done;$('sLeft').textContent=total-done;
  $('weight').textContent=total?'Cada etapa vale ≈ '+Math.round(100/total)+'%':'';
  $('clrDone').style.visibility=done?'visible':'hidden';

  const ul=$('list');ul.innerHTML='';
  const view=tasks.map((t,i)=>({t,i})).filter(({t})=>filter==='all'||(filter==='done'?t.done:!t.done));
  if(!view.length){
    ul.innerHTML='<div class="empty">'+(total?'Nenhuma etapa neste filtro.':'Nenhuma etapa ainda. Adicione a primeira acima.')+'</div>';
    return;
  }
  view.forEach(({t,i})=>{
    const li=document.createElement('li');
    if(t.done)li.className='on';
    const n=document.createElement('div');n.className='num';n.textContent=String(i+1).padStart(2,'0');
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;
    cb.setAttribute('aria-label','Concluir: '+t.text);
    cb.onchange=()=>{t.done=cb.checked;save();render()};
    const sp=document.createElement('span');sp.textContent=t.text;
    const x=document.createElement('button');x.className='del';x.title='Excluir etapa';x.setAttribute('aria-label','Excluir etapa');
    x.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
    x.onclick=()=>{tasks.splice(i,1);save();render()};
    li.append(n,cb,sp,x);ul.append(li);
  });
}

function addTask(text,done){text=text.trim();if(text)tasks.push({text,done:!!done})}
$('add').onclick=()=>{addTask($('new').value);$('new').value='';save();render();$('new').focus()};
$('new').onkeydown=e=>{if(e.key==='Enter')$('add').click()};
$('rmd').oninput=()=>{save();renderRmd()};
$('clr').onclick=()=>{if($('rmd').value&&confirm('Limpar o documento RMD?')){$('rmd').value='';save();renderRmd()}};
$('clrDone').onclick=()=>{tasks=tasks.filter(t=>!t.done);save();render()};
$('tabs').onclick=e=>{
  const b=e.target.closest('.tab');if(!b)return;
  filter=b.dataset.f;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  render();
};
$('imp').onclick=()=>{
  const re=/^\s*[-*+]\s+\[([ xX])\]\s+(.+)$/gm;let m,n=0;
  while((m=re.exec($('rmd').value))){addTask(m[2],m[1]!==' ');n++}
  save();render();
  if(!n)alert('Nenhum item no formato “- [ ] tarefa” foi encontrado no RMD.');
};

load();renderRmd();render();
</script>
</body>
</html>
